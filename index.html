<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1020"><meta name="description" content="Clearpath, a low-friction ADHD-friendly personal workspace."><title>Clearpath | Focus on what matters</title>
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Arial;color:#edf0ff;background:#0c1020;font-synthesis:none}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}.app{display:grid;grid-template-columns:245px minmax(0,1fr);min-height:100vh}.sidebar{background:#101628;border-right:1px solid #28304b;padding:25px 16px;display:flex;flex-direction:column;gap:34px}.brand{font-size:25px;font-weight:800;letter-spacing:-1.2px;padding:6px 12px}.brand span{color:#9da9ff}.brand small{display:block;font-size:9px;letter-spacing:2px;color:#8993ae;font-weight:650;margin-top:5px}nav{display:flex;flex-direction:column;gap:6px}nav button{border:0;background:transparent;color:#a7b0ca;padding:12px 15px;text-align:left;border-radius:10px;font-weight:600}nav button:hover,nav button.active{background:#26304c;color:#fff}.sidefoot{margin-top:auto;border-top:1px solid #2a314a;padding:18px 12px;font-size:12px;line-height:1.5;color:#929dba}.sidefoot button{width:100%;margin-top:8px}.content{max-width:1080px;margin:auto;padding:38px 42px 90px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:32px}.eyebrow{text-transform:uppercase;letter-spacing:2px;font-size:11px;font-weight:750;color:#a0aafb}.headline{display:flex;align-items:baseline;gap:18px;flex-wrap:wrap}.headline h1{font-size:31px;letter-spacing:-1px;margin:9px 0 0}.headline small{color:#8b96b3}.primary{background:#8b97ff;color:#101530;border:0;padding:11px 17px;border-radius:10px;font-weight:800}.primary:hover{background:#a2acff}.ghost{border:1px solid #424d6a;background:#192139;color:#dfe4ff;padding:9px 13px;border-radius:10px}.ghost:hover{background:#263451}.hero{border:1px solid #424a7b;background:linear-gradient(125deg,#232d58,#181d37);border-radius:18px;padding:27px 30px;display:flex;justify-content:space-between;align-items:center}.hero h2{font-size:23px;margin:0 0 7px}.hero p{color:#adb8dd;margin:0;font-size:14px}.hero .glyph{font-size:46px;color:#aab5ff}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px;margin:20px 0 35px}.stat{border:1px solid #29324e;background:#151d32;border-radius:14px;padding:19px}.stat b{font-size:27px;display:block;margin-bottom:5px}.stat small,.muted{color:#9aa6c4}.section{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:27px 0 13px}.section h2{font-size:18px;margin:0}.section small{color:#8695b6}.tasklist{border:1px solid #2d3754;background:#151c30;border-radius:14px;overflow:hidden}.task{display:flex;align-items:center;gap:14px;padding:16px;border-bottom:1px solid #27304a}.task:last-child{border-bottom:0}.task input[type=checkbox]{width:19px;height:19px;accent-color:#93a2ff;flex-shrink:0}.task-main{flex:1;min-width:0}.taskname{font-weight:650;overflow-wrap:anywhere}.task.done .taskname{text-decoration:line-through;color:#75819b}.meta{font-size:12px;color:#8e9bb6;margin-top:6px}.tag{font-size:11px;font-weight:700;padding:3px 7px;border-radius:6px;background:#303c58;margin-left:8px}.tag.high{color:#ffd18f;background:#493a32}.tag.critical{color:#ffb2b3;background:#4b303b}.overdue{color:#ff9c9c}.task-actions{display:flex;gap:8px}.task-actions button{background:none;border:0;color:#9ba9cb;font-size:18px}.empty{padding:29px;color:#9ca8c5;text-align:center}.filterbar{display:flex;gap:10px;flex-wrap:wrap}input,textarea,select{color:#edf1ff;background:#12182a;border:1px solid #3b4562;border-radius:9px;padding:10px 12px;outline:none;width:100%}input:focus,textarea:focus,select:focus{border-color:#99a7ff}input[type=checkbox]{width:auto}.filterbar input{max-width:320px}.filterbar select{width:150px}.projectgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:13px}.project{padding:22px;min-height:130px;text-align:left;border:1px solid #313c5b;background:#151d31;color:#f5f6ff;border-radius:14px}.project:hover{border-color:#92a0ff}.project strong{display:block;font-size:17px;margin-bottom:10px}.project small{color:#9aa7c2}.notes{display:grid;gap:13px}.note{background:#161d31;border:1px solid #303b58;border-radius:14px;padding:18px;white-space:pre-wrap;overflow-wrap:anywhere}.note strong{font-size:16px}.note p{color:#c2cbe0;line-height:1.55;font-size:14px}dialog{border:1px solid #465174;border-radius:17px;background:#171e33;color:#f6f7ff;width:min(550px,calc(100vw - 24px));padding:25px}dialog::backdrop{background:#050915d9}form label{display:block;font-size:13px;font-weight:650;margin-bottom:16px;color:#bcc8e4}form label input,form label select,form label textarea{margin-top:7px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}dialog header,dialog footer{display:flex;justify-content:space-between;align-items:center;gap:10px}dialog header{margin-bottom:17px}dialog h2{margin:0}dialog footer{justify-content:flex-end;margin-top:12px}dialog header button{border:0;background:none;color:#b3c0dc;font-size:20px}.focuscard{background:#161d32;border:1px solid #384366;border-radius:20px;max-width:620px;margin:30px auto;padding:40px;text-align:center}.clock{font-size:85px;letter-spacing:-5px;font-weight:800;font-variant-numeric:tabular-nums;margin:24px 0}.focuscard p{color:#aab6d1}.focusbuttons{display:flex;justify-content:center;gap:10px;margin-top:20px}.notice{font-size:12px;color:#a4b0c9;line-height:1.6;margin:20px 0}#toast{position:fixed;bottom:25px;right:25px;padding:13px 19px;background:#29375f;color:#fff;border:1px solid #6179bb;border-radius:12px;display:none;z-index:10}.right{display:flex;align-items:center;gap:9px}.small{font-size:12px}.danger{color:#ffb1b1}.linklike{border:0;background:none;color:#c5ccff;cursor:pointer;text-decoration:underline;padding:0}@media(max-width:750px){.app{display:block}.sidebar{padding:13px 12px;gap:12px;border-bottom:1px solid #29324a}.brand{font-size:22px;padding:2px 7px}.brand small{display:none}nav{flex-direction:row;overflow-x:auto;padding-bottom:5px}nav button{white-space:nowrap;padding:9px 12px;font-size:13px}.sidefoot{display:none}.content{padding:23px 17px 70px}.top{align-items:flex-start}.top .primary{white-space:nowrap;padding:10px 12px}.headline h1{font-size:25px}.stats{gap:8px}.stat{padding:15px 10px}.stat b{font-size:24px}.hero{padding:23px}.hero .glyph{display:none}.task{padding:14px 10px}.task-actions{gap:3px}.clock{font-size:60px}.focuscard{padding:23px}.two{grid-template-columns:1fr}}
</style></head><body>
<div class="app"><aside class="sidebar"><div class="brand"><span>◈</span> clearpath<small>YOUR PERSONAL OPERATING SYSTEM</small></div>
<nav id="nav"><button data-view="today" class="active">◫ Today</button><button data-view="inbox">⊞ Inbox</button><button data-view="tasks">☷ All tasks</button><button data-view="projects">▦ Projects</button><button data-view="notes">▤ Notes</button><button data-view="focus">◎ Focus</button></nav>
<div class="sidefoot">Capture first. Organise later.<button id="export" class="ghost">Export backup</button><button id="import" class="ghost">Import backup</button><input type="file" id="file" accept=".json,application/json" hidden></div></aside>
<main class="content"><header class="top"><div><span class="eyebrow">YOUR WORKSPACE</span><div class="headline"><h1 id="headline">Today</h1><small id="today"></small></div></div><button class="primary" id="capture">+ Quick capture</button></header><div id="main"></div></main></div>
<dialog id="taskDlg"><form id="taskForm"><header><h2 id="taskHeading">Capture a task</h2><button type="button" data-close="taskDlg">✕</button></header>
<label>What's the next action?<input name="title" maxlength="250" required placeholder="e.g. Review FAO comments"></label>
<div class="two"><label>Area<select name="area"><option>Work</option><option>School</option><option>Personal</option><option>Admin</option></select></label><label>Project<select id="taskProject" name="project_id"><option value="">No project</option></select></label></div>
<div class="two"><label>Priority<select name="priority"><option>Normal</option><option>High</option><option>Critical</option><option>Low</option></select></label><label>Due date<input type="date" name="due_date"></label></div>
<label>Notes<textarea name="notes" rows="3" placeholder="Context, links, next steps..."></textarea></label>
<footer><button class="ghost" type="button" data-close="taskDlg">Cancel</button><button class="primary" type="submit">Save task</button></footer></form></dialog>
<dialog id="projectDlg"><form id="projectForm"><header><h2>New project</h2><button type="button" data-close="projectDlg">✕</button></header><label>Project name<input name="name" required maxlength="150"></label><label>Area<select name="area"><option>Work</option><option>School</option><option>Personal</option><option>Admin</option></select></label><footer><button class="ghost" type="button" data-close="projectDlg">Cancel</button><button class="primary">Create</button></footer></form></dialog>
<dialog id="noteDlg"><form id="noteForm"><header><h2>Capture a note</h2><button type="button" data-close="noteDlg">✕</button></header><label>Title<input name="title" maxlength="250" required></label><label>Type<select name="category"><option>Note</option><option>Meeting</option><option>Evidence</option><option>Decision</option><option>Idea</option></select></label><label>Content<textarea name="content" rows="6"></textarea></label><footer><button class="ghost" type="button" data-close="noteDlg">Cancel</button><button class="primary">Save note</button></footer></form></dialog>
<div id="toast" role="status"></div>
<script>
(function(){
'use strict';
var KEY='clearpath.v1',state={tasks:[],projects:[],notes:[],focusSessions:[]},view='today',editing=null,search='',filter='All',focusSecs=1500,focusRunning=false,focusTimer=null;
var $=function(s){return document.querySelector(s);}, id=function(){return typeof crypto!=='undefined'&&crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random();};
var esc=function(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var day=function(){var d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-');};
try {var old=JSON.parse(localStorage.getItem(KEY)||'null');if(old){['tasks','projects','notes','focusSessions'].forEach(function(k){if(Array.isArray(old[k]))state[k]=old[k];});}}catch(e){console.warn('Stored data could not be loaded');}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){alert('Storage is full or unavailable. Export a backup now.');}}
function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';setTimeout(function(){$('#toast').style.display='none';},2600);}
function active(t){return t.status!=='Done';}
function taskSort(a,b){var p={Critical:0,High:1,Normal:2,Low:3};return (p[a.priority]||0)-(p[b.priority]||0)||String(a.due_date||'9999').localeCompare(b.due_date||'9999');}
function row(t){var p=state.projects.find(function(x){return x.id===t.project_id;});return '<div class="task'+(active(t)?'':' done')+'"><input type="checkbox" data-tick="'+esc(t.id)+'" '+(active(t)?'':'checked')+' aria-label="Mark task complete"><div class="task-main"><div class="taskname">'+esc(t.title)+'</div><div class="meta">'+esc(t.area)+(p?' · '+esc(p.name):'')+(t.priority==='High'||t.priority==='Critical'?'<span class="tag '+t.priority.toLowerCase()+'">'+esc(t.priority)+'</span>':'')+(t.due_date?' <span class="'+(active(t)&&t.due_date<day()?'overdue':'')+'"> ◷ '+esc(t.due_date)+'</span>':'')+'</div></div><div class="task-actions"><button data-edit="'+esc(t.id)+'" title="Edit">✎</button><button data-delete="'+esc(t.id)+'" title="Delete" class="danger">×</button></div></div>';}
function rows(ts,msg){return '<div class="tasklist">'+(ts.length?ts.map(row).join(''):'<div class="empty">'+esc(msg||'Nothing here yet.')+'</div>')+'</div>';}
function section(t,r){return '<div class="section"><h2>'+t+'</h2>'+(r||'')+'</div>';}
function todayView(){var open=state.tasks.filter(active),due=open.filter(function(t){return t.status==='Up next'||t.status==='In progress'||(t.due_date&&t.due_date<=day());}).sort(taskSort),top=due.slice(0,3),overdue=open.filter(function(t){return t.due_date&&t.due_date<day();}).length,other=open.filter(function(t){return !top.includes(t);}).sort(taskSort).slice(0,7);return '<section class="hero"><div><h2>Less noise. More progress.</h2><p>Three priorities are enough. Start with one small action.</p></div><div class="glyph">◎</div></section><div class="stats"><div class="stat"><b>'+top.length+'</b><small>Top priorities</small></div><div class="stat"><b>'+open.filter(function(t){return t.status==='Inbox';}).length+'</b><small>In your inbox</small></div><div class="stat"><b>'+overdue+'</b><small>Overdue</small></div></div>'+section('✦ Your top three','<small>Due dates and priority</small>')+rows(top,'Nothing urgent. Review your inbox.')+section('Everything else can wait','<button class="linklike" data-view="tasks">See all tasks</button>')+rows(other,'You are clear for now.');}
function inboxView(){return section('Capture first, organise later','<button class="ghost" data-new="task">+ Capture</button>')+rows(state.tasks.filter(function(t){return t.status==='Inbox';}),'Your inbox is empty.');}
function tasksView(){var ts=state.tasks.filter(function(t){return (filter==='All'||t.area===filter)&&(!search||String(t.title+' '+(t.notes||'')).toLowerCase().includes(search.toLowerCase()));}).sort(taskSort);return section('All tasks','<small>'+ts.length+' visible</small>')+'<div class="filterbar"><select id="area">'+['All','Work','School','Personal','Admin'].map(function(x){return '<option '+(filter===x?'selected':'')+'>'+x+'</option>';}).join('')+'</select><input placeholder="Search tasks" id="search" value="'+esc(search)+'"></div>'+rows(ts,'No matching tasks.');}
function projectsView(){return section('Projects & commitments','<button class="ghost" data-new="project">+ Project</button>')+'<div class="projectgrid">'+(state.projects.length?state.projects.map(function(p){return '<button class="project" data-project="'+esc(p.id)+'"><strong>'+esc(p.name)+'</strong><small>'+esc(p.area)+' · '+state.tasks.filter(function(t){return t.project_id===p.id&&active(t);}).length+' open tasks</small></button>';}).join(''):'<div class="empty">No projects yet. Add one.</div>')+'</div><div id="projectDetails"></div>';}
function notesView(){return section('Notes, decisions & evidence','<button class="ghost" data-new="note">+ Note</button>')+'<div class="notes">'+(state.notes.length?state.notes.slice().reverse().map(function(n){return '<article class="note"><strong>'+esc(n.title)+'</strong><div class="meta">'+esc(n.category)+' · '+esc((n.created_at||'').slice(0,10))+'</div><p>'+esc(n.content||'')+'</p></article>';}).join(''):'<div class="empty">Nothing captured yet.</div>')+'</div>';}
function fmt(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function focusView(){var sessions=state.focusSessions;return section('Just one thing','<small>A five-minute start still counts</small>')+'<div class="focuscard"><p>FOCUS SESSION</p><div id="clock" class="clock">'+fmt(focusSecs)+'</div><select id="focusTask"><option value="">General focus</option>'+state.tasks.filter(active).map(function(t){return '<option value="'+esc(t.id)+'">'+esc(t.title)+'</option>';}).join('')+'</select><div class="focusbuttons"><button id="focusBtn" class="primary">'+(focusRunning?'Pause':'Start')+'</button><button id="focusReset" class="ghost">Reset</button></div><p>'+sessions.length+' completed sessions · '+sessions.reduce(function(n,x){return n+x.minutes;},0)+' minutes logged</p></div>';}
function render(){var titles={today:'Good to see you.',inbox:'Clear your head.',tasks:'Everything in one place.',projects:'The big picture.',notes:'Capture the context.',focus:'Make room to focus.'};$('#headline').textContent=titles[view];$('#today').textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});document.querySelectorAll('#nav button').forEach(function(b){b.classList.toggle('active',b.dataset.view===view);});$('#main').innerHTML=({today:todayView,inbox:inboxView,tasks:tasksView,projects:projectsView,notes:notesView,focus:focusView})[view]();}
function openTask(t){editing=t?t.id:null;$('#taskForm').reset();$('#taskHeading').textContent=t?'Edit task':'Capture a task';$('#taskProject').innerHTML='<option value="">No project</option>'+state.projects.map(function(p){return '<option value="'+esc(p.id)+'">'+esc(p.name)+'</option>';}).join('');if(t){['title','area','project_id','priority','due_date','notes'].forEach(function(k){$('#taskForm').elements[k].value=t[k]||'';});}$('#taskDlg').showModal();}
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;
if(b.dataset.view){view=b.dataset.view;render();return;}
if(b.dataset.new==='task'||b.id==='capture'){openTask();return;}
if(b.dataset.new==='project'){$('#projectForm').reset();$('#projectDlg').showModal();return;}
if(b.dataset.new==='note'){$('#noteForm').reset();$('#noteDlg').showModal();return;}
if(b.dataset.close){$('#'+b.dataset.close).close();return;}
if(b.dataset.edit){openTask(state.tasks.find(function(t){return t.id===b.dataset.edit;}));return;}
if(b.dataset.delete){if(confirm('Delete this task?')){state.tasks=state.tasks.filter(function(t){return t.id!==b.dataset.delete;});save();render();}return;}
if(b.dataset.project){var p=state.projects.find(function(x){return x.id===b.dataset.project;});var tasks=state.tasks.filter(function(t){return t.project_id===p.id;});$('#projectDetails').innerHTML=section(esc(p.name)+' tasks')+rows(tasks,'No tasks assigned.');return;}
if(b.id==='focusBtn'){if(focusRunning){clearInterval(focusTimer);focusRunning=false;render();}else{focusRunning=true;focusTimer=setInterval(function(){focusSecs--;var c=$('#clock');if(c)c.textContent=fmt(Math.max(0,focusSecs));if(focusSecs<=0){clearInterval(focusTimer);focusRunning=false;state.focusSessions.push({id:id(),task_id:$('#focusTask')?$('#focusTask').value:null,minutes:25,finished_at:new Date().toISOString()});save();focusSecs=1500;toast('Focus session completed');render();}},1000);render();}return;}
if(b.id==='focusReset'){clearInterval(focusTimer);focusRunning=false;focusSecs=1500;render();}
});
document.addEventListener('change',function(e){if(e.target.dataset.tick){var t=state.tasks.find(function(x){return x.id===e.target.dataset.tick;});if(t){t.status=e.target.checked?'Done':'Up next';t.updated_at=new Date().toISOString();save();render();}}if(e.target.id==='area'){filter=e.target.value;render();}});
document.addEventListener('input',function(e){if(e.target.id==='search'){search=e.target.value;var p=e.target.selectionStart;render();var i=$('#search');i.focus();i.setSelectionRange(p,p);}});
$('#taskForm').addEventListener('submit',function(e){e.preventDefault();var data=Object.fromEntries(new FormData(e.target).entries());if(!data.title.trim())return;var t=state.tasks.find(function(x){return x.id===editing;});if(t){Object.assign(t,data,{updated_at:new Date().toISOString()});}else{state.tasks.push(Object.assign({id:id(),status:'Inbox',created_at:new Date().toISOString(),updated_at:new Date().toISOString()},data));}save();$('#taskDlg').close();render();toast(editing?'Task updated':'Task captured');});
$('#projectForm').addEventListener('submit',function(e){e.preventDefault();var d=Object.fromEntries(new FormData(e.target).entries());if(!d.name.trim())return;state.projects.push({id:id(),name:d.name.trim(),area:d.area,created_at:new Date().toISOString()});save();$('#projectDlg').close();render();});
$('#noteForm').addEventListener('submit',function(e){e.preventDefault();var d=Object.fromEntries(new FormData(e.target).entries());state.notes.push(Object.assign({id:id(),created_at:new Date().toISOString()},d));save();$('#noteDlg').close();render();});
$('#export').onclick=function(){var blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),...state},null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='clearpath-backup.json';a.click();setTimeout(function(){URL.revokeObjectURL(a.href);},1000);};
$('#import').onclick=function(){$('#file').click();};
$('#file').addEventListener('change',async function(e){var file=e.target.files[0];if(!file)return;try{var data=JSON.parse(await file.text());if(!Array.isArray(data.tasks)||!Array.isArray(data.projects))throw Error('Not a Clearpath backup');if(!confirm('Replace local Clearpath data with this backup? Export your existing backup first.'))return;['tasks','projects','notes','focusSessions'].forEach(function(k){state[k]=Array.isArray(data[k])?data[k]:[];});save();render();toast('Backup imported');}catch(err){alert(err.message);}e.target.value='';});
document.addEventListener('keydown',function(e){if(e.key.toLowerCase()==='k'&&(e.ctrlKey||e.metaKey)){e.preventDefault();openTask();}});
render();
})();
</script></body></html>
